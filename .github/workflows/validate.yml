name: Validate skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover skill
        run: npx --yes skills add . --list
      - name: Test archive with isolated recordings
        shell: powershell
        run: ./tests/windows.ps1
